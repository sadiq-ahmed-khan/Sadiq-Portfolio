<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Check</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f2f2f0;
      --muted: #96969a;
      --line: rgba(255, 255, 255, 0.10);
      --card: #141416;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 32px;
      background: var(--card);
    }
    h1 { font-size: 18px; margin-bottom: 20px; font-weight: 600; }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .row:last-child { border-bottom: none; }
    .label { color: var(--muted); }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    pre {
      margin-top: 16px;
      font-size: 11px;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>// health check</h1>
    <div class="row"><span class="label">deploy</span><span class="ok">ok</span></div>
    <div class="row"><span class="label">build time</span><span id="buildTime">—</span></div>
    <div class="row"><span class="label">fetch status</span><span id="fetchStatus">pending…</span></div>
    <pre id="fetchData">loading…</pre>
  </div>

  <script>
    document.getElementById('buildTime').textContent = new Date().toISOString();

    fetch('https://api.github.com/zen')
      .then(res => {
        if (!res.ok) throw new Error('status ' + res.status);
        return res.text();
      })
      .then(text => {
        document.getElementById('fetchStatus').textContent = '200 ok';
        document.getElementById('fetchStatus').className = 'ok';
        document.getElementById('fetchData').textContent = text;
      })
      .catch(err => {
        document.getElementById('fetchStatus').textContent = 'failed';
        document.getElementById('fetchStatus').className = 'err';
        document.getElementById('fetchData').textContent = String(err);
      });
  </script>
</body>
</html>
